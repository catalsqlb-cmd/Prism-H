<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#b0bcc8"/>
    </marker>
  </defs>
  <rect width="900" height="120" fill="#fafbfc" rx="10"/>

  <!-- stages: x = 14 + i*144 ; box 122x54 at y=30 -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 0 PRISM -->
    <g>
      <rect x="14"  y="30" width="122" height="54" rx="9" fill="#e23b3b" fill-opacity="0.10" stroke="#e23b3b" stroke-width="1.8"/>
      <text x="75"  y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">PRISM</text>
      <text x="75"  y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">detect</text>
      <text x="75"  y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">PRISM_PROFILE.md</text>
    </g>
    <!-- 1 Literature -->
    <g>
      <rect x="158" y="30" width="122" height="54" rx="9" fill="#f08a24" fill-opacity="0.10" stroke="#f08a24" stroke-width="1.8"/>
      <text x="219" y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">Literature</text>
      <text x="219" y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">/research-lit</text>
      <text x="219" y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">LIT_REVIEW.md</text>
    </g>
    <!-- 2 Question -->
    <g>
      <rect x="302" y="30" width="122" height="54" rx="9" fill="#e3b505" fill-opacity="0.12" stroke="#d9a900" stroke-width="1.8"/>
      <text x="363" y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">Question</text>
      <text x="363" y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">/research-refine</text>
      <text x="363" y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">FINAL_PROPOSAL.md</text>
    </g>
    <!-- 3 Evidence -->
    <g>
      <rect x="446" y="30" width="122" height="54" rx="9" fill="#4caf50" fill-opacity="0.10" stroke="#4caf50" stroke-width="1.8"/>
      <text x="507" y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">Evidence</text>
      <text x="507" y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">statutes·cases·args</text>
      <text x="507" y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">RESEARCH_LOG.md</text>
    </g>
    <!-- 4 Review -->
    <g>
      <rect x="590" y="30" width="122" height="54" rx="9" fill="#4a9eda" fill-opacity="0.10" stroke="#4a9eda" stroke-width="1.8"/>
      <text x="651" y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">Review</text>
      <text x="651" y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">/research-review</text>
      <text x="651" y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">RESEARCH_REVIEW.md</text>
    </g>
    <!-- 5 Paper -->
    <g>
      <rect x="734" y="30" width="122" height="54" rx="9" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-width="1.8"/>
      <text x="795" y="52" text-anchor="middle" fill="#2b2b2b" font-size="14" font-weight="700">Paper</text>
      <text x="795" y="68" text-anchor="middle" fill="#777" font-family="monospace" font-size="8.5">/paper-writing</text>
      <text x="795" y="100" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="7.5">main.pdf</text>
    </g>
  </g>

  <!-- arrows between boxes (y=57) -->
  <g stroke="#b0bcc8" stroke-width="2">
    <line x1="138" y1="57" x2="154" y2="57" marker-end="url(#arr)"/>
    <line x1="282" y1="57" x2="298" y2="57" marker-end="url(#arr)"/>
    <line x1="426" y1="57" x2="442" y2="57" marker-end="url(#arr)"/>
    <line x1="570" y1="57" x2="586" y2="57" marker-end="url(#arr)"/>
    <line x1="714" y1="57" x2="730" y2="57" marker-end="url(#arr)"/>
  </g>
</svg>
