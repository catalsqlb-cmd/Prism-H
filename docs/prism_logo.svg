<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100">
  <defs>
    <!-- Spectrum gradient: white light split into its colours -->
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#e23b3b"/>
      <stop offset="17%" stop-color="#f08a24"/>
      <stop offset="34%" stop-color="#f5c518"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="67%" stop-color="#22b8cf"/>
      <stop offset="84%" stop-color="#4a9eda"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Glass body of the prism -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#cfe2f3" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="480" height="100" fill="#fafbfc" rx="10"/>

  <!-- ═══ Incoming white light ray ═══ -->
  <line x1="16" y1="52" x2="80" y2="52" stroke="#aab4be" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="52" x2="80" y2="52" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- ═══ Triangular prism ═══ -->
  <polygon points="90,24 64,74 116,74" fill="url(#glass)" stroke="#b9c6d4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ═══ Refracted spectrum fanning from the exit face ═══ -->
  <g stroke-width="3.4" stroke-linecap="round" opacity="0.9">
    <line x1="106" y1="54" x2="219" y2="22" stroke="#e23b3b"/>
    <line x1="106" y1="54" x2="221" y2="32" stroke="#f08a24"/>
    <line x1="106" y1="54" x2="223" y2="42" stroke="#f5c518"/>
    <line x1="106" y1="54" x2="224" y2="52" stroke="#4caf50"/>
    <line x1="106" y1="54" x2="223" y2="62" stroke="#22b8cf"/>
    <line x1="106" y1="54" x2="221" y2="72" stroke="#4a9eda"/>
    <line x1="106" y1="54" x2="219" y2="82" stroke="#8b5cf6"/>
  </g>

  <!-- ═══ Wordmark + tagline ═══ -->
  <text x="320" y="50" text-anchor="middle" fill="url(#spectrum)" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="3">Prism</text>
  <text x="320" y="73" text-anchor="middle" font-family="monospace" font-size="11"><tspan fill="#4a9eda">Claude</tspan><tspan fill="#888"> × </tspan><tspan fill="#74aa63">GPT</tspan></text>
  <text x="320" y="88" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="8.5" letter-spacing="1">speed × rigor</text>
</svg>
