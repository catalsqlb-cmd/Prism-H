<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <defs>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cfe2f3" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" fill="#fafbfc" rx="10"/>

  <!-- incoming research-direction beam -->
  <text x="26" y="180" fill="#888" font-family="monospace" font-size="12">one research</text>
  <text x="26" y="196" fill="#888" font-family="monospace" font-size="12">direction</text>
  <line x1="24" y1="205" x2="150" y2="205" stroke="#aab4be" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="205" x2="150" y2="205" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- prism -->
  <polygon points="172,140 124,250 220,250" fill="url(#glass2)" stroke="#b9c6d4" stroke-width="2" stroke-linejoin="round"/>
  <text x="172" y="272" text-anchor="middle" fill="#9aa3ac" font-family="monospace" font-size="11">PRISM detects</text>

  <!-- 10 discipline rays + labels (origin ~205,200 → x=680) -->
  <g stroke-width="3" stroke-linecap="round" opacity="0.92">
    <line x1="205" y1="200" x2="680" y2="30"  stroke="#e23b3b"/>
    <line x1="205" y1="200" x2="680" y2="68"  stroke="#f0641f"/>
    <line x1="205" y1="200" x2="680" y2="105" stroke="#f08a24"/>
    <line x1="205" y1="200" x2="680" y2="142" stroke="#e3b505"/>
    <line x1="205" y1="200" x2="680" y2="178" stroke="#8bc34a"/>
    <line x1="205" y1="200" x2="680" y2="213" stroke="#4caf50"/>
    <line x1="205" y1="200" x2="680" y2="248" stroke="#22b8cf"/>
    <line x1="205" y1="200" x2="680" y2="285" stroke="#4a9eda"/>
    <line x1="205" y1="200" x2="680" y2="322" stroke="#6c79e0"/>
    <line x1="205" y1="200" x2="680" y2="360" stroke="#8b5cf6"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2b2b2b">
    <text x="692" y="35">Law</text>
    <text x="692" y="73">Sports-Law</text>
    <text x="692" y="110">Philosophy</text>
    <text x="692" y="147">Logic</text>
    <text x="692" y="183">Economics</text>
    <text x="692" y="218">Social Sciences</text>
    <text x="692" y="253">Education</text>
    <text x="692" y="290">Management</text>
    <text x="692" y="327">Communications</text>
    <text x="692" y="365">Humanities</text>
